---
- name: OpenStack Lab Környezet Teljes Konfigurálása
  hosts: all
  become: yes # Sudo joggal futtat mindent
  gather_facts: yes

  tasks:
    - name: 1. Rendszerfrissítés futtatása (apt update & upgrade)
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: 2. Gép újraindítása a friss kernel élesítéséhez (Senior DevOps Move)
      reboot:
        reboot_timeout: 300

    - name: 3. MicroStack letöltése és telepítése Snap segítségével
      snap:
        name: microstack
        channel: beta
        devmode: yes # EZT JAVÍTOTTUK! Így már szabályos az Ansible számára

    - name: 4. MicroStack inicializálása (Aszinkron indítás a beragadás elkerülésére)
      shell: "microstack init --auto --control > /home/ubuntu/microstack_init.log 2>&1"
      async: 900
      poll: 0

    - name: 5. Várakozás az OpenStack API (Keystone) elindulására (Port 5000)
      wait_for:
        port: 5000
        delay: 30
        timeout: 600

    - name: 6. Kényelmi openstack alias hozzáadása az ubuntu felhasználónak
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: "alias openstack='microstack.openstack'"
        state: present